[rule]
description = """
Identifies HideCursor.exe or HideUL.exe launched by a ScreenConnect client process. Threat actors have used these
defense-evasion binaries after establishing a rogue ScreenConnect session to hide the cursor and conceal on-screen
interactive activity.
"""
id = "c8c028db-4123-4f13-9318-03975f4a78f7"
license = "Elastic License v2"
name = "Cursor Hiding Utility via ScreenConnect"
os_list = ["windows"]
reference = ["https://www.huntress.com/blog/phishing-bitb-rmm-attacks"]
version = "1.0.0"

query = '''
process where event.action == "start" and
 (process.pe.original_file_name : ("HideUL.exe", "HideCursor.exe") or
  process.name : ("HideUL*.exe", "HideCursor*.exe")) and
 process.parent.name : ("ScreenConnect.WindowsFileManager.exe", "ScreenConnect.WindowsClient.exe")
'''

min_endpoint_version = "8.10.0"
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 0

[[optional_actions]]
action = "rollback"
field = "process.entity_id"
state = 0

[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1564"
name = "Hide Artifacts"
reference = "https://attack.mitre.org/techniques/T1564/"


[threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1219"
name = "Remote Access Tools"
reference = "https://attack.mitre.org/techniques/T1219/"


[threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"

[internal]
min_endpoint_version = "8.10.0"
