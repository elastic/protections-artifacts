[rule]
description = """
Detects creation of a file whose leading bytes match the common javascript-obfuscator fingerprint and whose content
entropy is elevated, when written by JavaScript runtimes, shells, download or archive utilities, living-off-the-land
binaries, Git, or developer IDEs. Recent npm supply chain campaigns (including Mini Shai-Hulud / Team PCP style attacks)
drop heavily obfuscated second-stage payloads during package install hooks, often via node or a downloaded Bun runtime,
and may also stage those payloads through curl, archive extraction, shell/cmd/PowerShell wrappers, certutil, Git
checkout/clone activity, or editors such as VS Code and Cursor.
"""
id = "8282aa02-caa3-4d5e-aab7-76416c3252b2"
license = "Elastic License v2"
name = "Potential Obfuscated JavaScript File Creation"
os_list = ["linux", "windows"]
reference = [
    "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain",
    "https://www.stepsecurity.io/blog/a-mini-shai-hulud-has-appeared",
]
version = "1.0.1"

query = '''
file where event.type == "creation" and file.extension : ("js", "mjs", "cjs") and 
  process.name : (
    "node", "nodejs", "node.exe",
    "bun", "bun.exe",
    "curl", "curl.exe",
    "wget", "wget.exe",
    "unzip", "unzip.exe",
    "tar", "tar.exe",
    "powershell.exe", "pwsh.exe",
    "cmd.exe",
    "certutil.exe",
    "bash", "sh", "zsh", "dash", "busybox", "ash", "mksh", "fish", "tcsh", 
    "Code.exe", "code",
    "Cursor.exe", "cursor",
    "git", "git.exe"
  ) and
  file.Ext.header_bytes : ("636f6e7374205f3078*", "766172205f3078*", "6c6574205f3078*", "7472797b6576616c*") and
  file.Ext.entropy >= 4.9 and 
  not (process.name == "node" and file.path like "/home/*/daego_web/frontend/dist/assets/*.js")
'''

min_endpoint_version = "9.3.0"
optional_actions = []
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0

