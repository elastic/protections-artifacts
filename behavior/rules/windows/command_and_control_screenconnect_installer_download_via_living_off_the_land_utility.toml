[rule]
description = """
Identifies cmd, PowerShell, curl, msiexec, certutil, or certreq downloading or installing a ScreenConnect ClientSetup
package from an HTTP(S) URL. This includes Guest access installer URLs and ScreenConnect web-server Bin paths on port
8040. Threat actors have used these utilities after phishing or from an existing ScreenConnect session to fetch a client
installer for persistent remote access.
"""
id = "d6293bab-3ef5-46a6-8f06-f76fb9c6d3d9"
license = "Elastic License v2"
name = "ScreenConnect Installer Download via Living-off-the-Land Utility"
os_list = ["windows"]
reference = ["https://www.huntress.com/blog/phishing-bitb-rmm-attacks"]
version = "1.0.1"

query = '''
process where event.action == "start" and
 process.name : ("cmd.exe", "powershell.exe", "pwsh.exe", "curl.exe", "msiexec.exe", "certutil.exe", "certreq.exe", "bitsadmin.exe") and
 process.command_line : "*http*" and
 process.command_line : ("*ScreenConnect.ClientSetup.msi*", "*e=Access&y=Guest*", "*:8040/Bin/*.msi*")
'''

min_endpoint_version = "8.10.0"
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0
tree = true

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 0
tree = true

[[optional_actions]]
action = "rollback"
field = "process.entity_id"
state = 0

[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1105"
name = "Ingress Tool Transfer"
reference = "https://attack.mitre.org/techniques/T1105/"

[[threat.technique]]
id = "T1219"
name = "Remote Access Tools"
reference = "https://attack.mitre.org/techniques/T1219/"


[threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"

[internal]
min_endpoint_version = "8.10.0"
